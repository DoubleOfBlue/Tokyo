<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokyo Itinerary — Line Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2438; --ink-soft:#4a5468; --paper:#f7f6f2; --paper-raised:#ffffff;
    --line:#dcd8cd; --accent:#c0392b; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:340px;min-width:340px;background:var(--paper-raised);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden;z-index:20;}
  header{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
  header p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .toolbar{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:8px;font-size:13px;font-weight:600;transition:transform .08s ease, background .15s ease;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.55;cursor:default;}
  .btn-primary{flex:1;background:var(--ink);color:#fff;padding:10px 12px;}
  .btn-primary.active{background:var(--accent);}
  .btn-secondary{flex:1;background:#eeece4;color:var(--ink);padding:10px 12px;}
  .btn-secondary.active{background:var(--accent);color:#fff;}
  .scroll-area{flex:1;overflow-y:auto;padding:6px 0 20px;}
  .day-group{margin:14px 18px 0;}
  .day-title{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;margin-bottom:8px;}
  .day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .stop-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:7px;cursor:pointer;position:relative;}
  .stop-card:hover{border-color:var(--ink-soft);}
  .stop-name{font-weight:600;font-size:13.5px;}
  .stop-notes{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stop-del{position:absolute;top:8px;right:8px;background:none;color:var(--ink-soft);font-size:15px;line-height:1;padding:2px 4px;border-radius:5px;}
  .stop-del:hover{background:#e5e1d5;color:var(--accent);}
  .empty-hint{margin:24px 18px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  #legend{border-top:1px solid var(--line);padding:12px 18px 16px;max-height:34%;overflow-y:auto;}
  #legend h2{font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .legend-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;}
  .legend-item:hover{background:#eeece4;}
  .legend-item.dimmed{opacity:.4;}
  .legend-swatch{width:16px;height:5px;border-radius:3px;flex-shrink:0;}
  .legend-clear{margin-top:6px;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:4px 6px;}
  #map{flex:1;height:100%;}
  .pin-label{font-family:'Inter',sans-serif;font-weight:600;font-size:11.5px;background:var(--paper-raised);border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .pin-dot{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .hint-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:500;z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-width:80%;text-align:center;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--paper-raised);border-radius:14px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 14px;}
  .modal p.sub{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px;line-height:1.5;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;background:var(--paper);color:var(--ink);}
  .field textarea{resize:vertical;min-height:50px;}
  .field small{display:block;margin-top:4px;color:var(--ink-soft);font-size:11px;}
  .day-colors{display:flex;gap:6px;flex-wrap:wrap;}
  .day-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
  .day-swatch.selected{border-color:var(--ink);}
  .leg-block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--paper);}
  .leg-block .leg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .leg-block .leg-top span{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .leg-remove{background:none;color:var(--accent);font-size:12px;font-weight:600;}
  .leg-result{border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;}
  .leg-result.found{background:#eef6ee;}
  .leg-result.notfound{background:#fbecec;color:var(--accent);}
  .leg-result-bar{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0;min-height:28px;}
  .leg-result-body{flex:1;}
  .leg-result-name{font-weight:600;}
  .leg-result-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .find-btn{width:100%;background:var(--ink);color:#fff;padding:9px;border-radius:8px;font-size:13px;margin-top:2px;}
  .add-leg-btn{width:100%;background:#eeece4;color:var(--ink);padding:9px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions button{flex:1;padding:11px;}
  .btn-cancel{background:#eeece4;color:var(--ink);}
  .btn-save{background:var(--ink);color:#fff;}
  .status-line{font-size:11.5px;color:var(--ink-soft);margin-top:8px;min-height:14px;line-height:1.5;}
  .match-choice{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .match-choice:hover{background:#eeece4;}
  .autocomplete-box{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;max-height:160px;overflow-y:auto;z-index:10;box-shadow:0 6px 16px rgba(0,0,0,.12);display:none;}
  .ac-list.open{display:block;}
  .ac-item{padding:7px 10px;font-size:13px;cursor:pointer;}
  .ac-item:hover{background:#eeece4;}
  @media (max-width:760px){
    #app{flex-direction:column;}
    #sidebar{width:100%;min-width:0;height:44%;border-right:none;border-bottom:1px solid var(--line);order:2;}
    #map{height:56%;order:1;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1>Tokyo Itinerary</h1>
      <p>Tap a pin to add it, connect two pins to find the train route between them.</p>
    </header>
    <div class="toolbar">
      <button class="btn-primary" id="btnAddPin">+ Pin</button>
      <button class="btn-secondary" id="btnAddRoute">+ Route</button>
    </div>
    <div class="scroll-area" id="stopList"></div>
    <div id="legend">
      <h2>Lines used</h2>
      <div id="legendItems"></div>
      <button class="legend-clear" id="legendClear" style="display:none;">Clear highlight</button>
    </div>
  </div>
  <div style="position:relative;flex:1;">
    <div class="hint-banner" id="hintBanner"></div>
    <div id="map"></div>
  </div>
</div>

<!-- Pin modal -->
<div class="modal-overlay" id="pinModalOverlay">
  <div class="modal">
    <h2>Add stop</h2>
    <div class="field"><label>Name</label><input type="text" id="pinName" placeholder="e.g. Senso-ji Temple"></div>
    <div class="field"><label>Day</label><div class="day-colors" id="dayColorPicker"></div></div>
    <div class="field"><label>Notes (optional)</label><textarea id="pinNotes" placeholder="Opening hours, tips, meeting point..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="pinCancel">Cancel</button>
      <button class="btn-save" id="pinSave">Save pin</button>
    </div>
  </div>
</div>

<!-- Route modal -->
<div class="modal-overlay" id="routeModalOverlay">
  <div class="modal">
    <h2>Route: <span id="routeFromTo"></span></h2>
    <p class="sub">Works fully offline using a bundled Tokyo rail dataset — type the station name and pick it from the list.</p>
    <div id="legsContainer"></div>
    <button class="add-leg-btn" id="addLegBtn">+ Add another leg (transfer)</button>
    <div class="status-line" id="routeStatus"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="routeCancel">Cancel</button>
      <button class="btn-save" id="routeSave" disabled>Save route</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const LINE_COLOR_HINTS = [
  ["Yamanote", "#9acd32"],["Chuo-Sobu", "#ffd400"],["Chuo", "#f15a22"],["Keihin-Tohoku", "#00b2e5"],
  ["Saikyo", "#00ac9a"],["Sobu", "#ffd400"],["Joban", "#00b261"],["Keiyo", "#c9c22c"],["Ginza", "#ff9500"],
  ["Marunouchi", "#f62e36"],["Hibiya", "#b5b5ac"],["Tozai", "#009bbf"],["Chiyoda", "#00a650"],
  ["Yurakucho", "#c1a470"],["Hanzomon", "#8f76d6"],["Namboku", "#00ada9"],["Fukutoshin", "#9c5e31"],
  ["Asakusa", "#e85298"],["Mita", "#0079c2"],["Shinjuku", "#6cbb5a"],["Oedo", "#b6007a"],
  ["Keio", "#dd1f5e"],["Odakyu", "#1e50a2"],["Keisei", "#0d59a4"],["Keikyu", "#00509e"],["Yurikamome", "#7ac143"]
];
function colorForLine(name){
  const hit = LINE_COLOR_HINTS.find(([k]) => name.includes(k));
  return hit ? hit[1] : '#446688';
}
const DAY_PALETTE = ["#c0392b","#1e6091","#2e8b57","#b8860b","#7d3c98","#c2185b","#00838f","#5d4037"];

// Flat index: lowercased station name -> [{line, index}], for fast lookup while typing.
const STATION_INDEX = {};
Object.keys(LINE_DATA).forEach(line=>{
  LINE_DATA[line].forEach((st, idx)=>{
    const key = st.name.toLowerCase();
    (STATION_INDEX[key] = STATION_INDEX[key] || []).push({line, idx});
  });
});
const ALL_STATION_NAMES = Array.from(new Set(Object.keys(STATION_INDEX))).sort();

function searchStations(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const starts = ALL_STATION_NAMES.filter(n => n.startsWith(q));
  const contains = ALL_STATION_NAMES.filter(n => !n.startsWith(q) && n.includes(q));
  return [...starts, ...contains].slice(0, 8);
}

let pins = [], routes = [], markers = {}, polylineGroups = {};
let mode = null, routeSelection = [];
let editingPinCoords = null, highlightedLine = null;

const map = L.map('map', {zoomControl:true}).setView([35.6812,139.7671], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const hintBanner = document.getElementById('hintBanner');
function showHint(text){ hintBanner.textContent = text; hintBanner.style.display='block'; }
function hideHint(){ hintBanner.style.display='none'; }

function loadData(){
  try{
    const raw = localStorage.getItem('tokyo-itinerary-data');
    if(raw){ const p = JSON.parse(raw); pins = p.pins || []; routes = p.routes || []; }
  }catch(e){}
  renderAll();
}
function saveData(){
  try{ localStorage.setItem('tokyo-itinerary-data', JSON.stringify({pins,routes})); }catch(e){ console.error('save failed', e); }
}

function dayColor(day){ const n = parseInt(day,10) || 1; return DAY_PALETTE[(n-1) % DAY_PALETTE.length]; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function renderAll(){ renderMarkers(); renderRoutes(); renderSidebar(); renderLegend(); }

function renderMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  pins.forEach(p=>{
    const color = dayColor(p.day);
    const icon = L.divIcon({
      className:'',
      html:`<div style="display:flex;flex-direction:column;align-items:center;">
              <div class="pin-dot" style="width:16px;height:16px;background:${color};"></div>
              <div class="pin-label" style="margin-top:2px;">${escapeHtml(p.name)}</div>
            </div>`,
      iconSize:[0,0], iconAnchor:[8,8]
    });
    const marker = L.marker([p.lat,p.lng], {icon}).addTo(map);
    marker.on('click', ()=> onPinClicked(p.id));
    markers[p.id] = marker;
  });
}

function renderRoutes(){
  Object.values(polylineGroups).flat().forEach(pl => map.removeLayer(pl));
  polylineGroups = {};
  routes.forEach(r=>{
    const group = [];
    r.legs.forEach(leg=>{
      const dimmed = highlightedLine && highlightedLine !== leg.line;
      const pl = L.polyline(leg.coords, {
        color: leg.color,
        weight: highlightedLine === leg.line ? 6 : 4,
        opacity: dimmed ? 0.15 : 0.9,
        dashArray: leg.approx ? '2,8' : null
      }).addTo(map);
      pl.bindPopup(`<b>${escapeHtml(leg.line)}</b><br>${escapeHtml(leg.from)} → ${escapeHtml(leg.to)}${leg.approx ? '<br><i style="color:#999">approximate path</i>':''}`);
      group.push(pl);
    });
    polylineGroups[r.id] = group;
  });
}

function renderSidebar(){
  const el = document.getElementById('stopList');
  if(pins.length === 0){
    el.innerHTML = `<div class="empty-hint">No stops yet. Tap <b>+ Pin</b>, then click anywhere on the map to drop your first stop.</div>`;
    return;
  }
  const byDay = {};
  pins.forEach(p=>{ const d = p.day || 1; (byDay[d] = byDay[d] || []).push(p); });
  const days = Object.keys(byDay).sort((a,b)=>a-b);
  el.innerHTML = days.map(d=>{
    const stops = byDay[d].map(p=>`
      <div class="stop-card" data-id="${p.id}">
        <button class="stop-del" data-id="${p.id}">✕</button>
        <div class="stop-name">${escapeHtml(p.name)}</div>
        ${p.notes ? `<div class="stop-notes">${escapeHtml(p.notes)}</div>` : ''}
      </div>`).join('');
    return `<div class="day-group">
      <div class="day-title"><span class="day-dot" style="background:${dayColor(d)}"></span>Day ${d}</div>
      ${stops}
    </div>`;
  }).join('');
  el.querySelectorAll('.stop-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.classList.contains('stop-del')) return;
      const id = card.dataset.id, p = pins.find(x=>x.id===id);
      if(p){ map.setView([p.lat,p.lng], 15); markers[id].openPopup && markers[id].openPopup(); }
    });
  });
  el.querySelectorAll('.stop-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deletePin(btn.dataset.id); });
  });
}

function renderLegend(){
  const usedLines = {};
  routes.forEach(r=> r.legs.forEach(leg=>{ usedLines[leg.line] = leg.color; }));
  const el = document.getElementById('legendItems');
  const names = Object.keys(usedLines);
  if(names.length===0){
    el.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);">Add a route to see lines here.</div>`;
    document.getElementById('legendClear').style.display='none';
    return;
  }
  el.innerHTML = names.map(name=>`
    <div class="legend-item ${highlightedLine && highlightedLine!==name ? 'dimmed':''}" data-line="${escapeAttr(name)}">
      <span class="legend-swatch" style="background:${usedLines[name]}"></span>${escapeHtml(name)}
    </div>`).join('');
  el.querySelectorAll('.legend-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const line = item.dataset.line;
      highlightedLine = (highlightedLine === line) ? null : line;
      renderRoutes(); renderLegend();
      document.getElementById('legendClear').style.display = highlightedLine ? 'block' : 'none';
    });
  });
  document.getElementById('legendClear').style.display = highlightedLine ? 'block' : 'none';
}
document.getElementById('legendClear').addEventListener('click', ()=>{ highlightedLine = null; renderRoutes(); renderLegend(); });

// ---------------- Mode toggles ----------------
const btnAddPin = document.getElementById('btnAddPin');
const btnAddRoute = document.getElementById('btnAddRoute');
btnAddPin.addEventListener('click', ()=> setMode(mode==='pin' ? null : 'pin'));
btnAddRoute.addEventListener('click', ()=> setMode(mode==='route' ? null : 'route'));

function setMode(m){
  mode = m; routeSelection = [];
  btnAddPin.classList.toggle('active', m==='pin');
  btnAddRoute.classList.toggle('active', m==='route');
  if(m==='pin') showHint('Tap anywhere on the map to drop a pin');
  else if(m==='route') showHint('Tap your first stop, then your second stop');
  else hideHint();
}

map.on('click', (e)=>{ if(mode==='pin'){ editingPinCoords = e.latlng; openPinModal(); } });

function onPinClicked(id){
  if(mode==='route'){
    if(!routeSelection.includes(id)) routeSelection.push(id);
    if(routeSelection.length===1){
      const p = pins.find(x=>x.id===id);
      showHint(`"${p.name}" selected — now tap the second stop`);
    } else if(routeSelection.length===2){
      openRouteModal(routeSelection[0], routeSelection[1]);
      setMode(null);
    }
  } else {
    const p = pins.find(x=>x.id===id);
    if(p) markers[id].openPopup && markers[id].openPopup();
  }
}

// ---------------- Pin modal ----------------
const pinModalOverlay = document.getElementById('pinModalOverlay');
const dayColorPicker = document.getElementById('dayColorPicker');
let selectedDay = 1;

function buildDayPicker(){
  dayColorPicker.innerHTML = '';
  for(let d=1; d<=8; d++){
    const sw = document.createElement('div');
    sw.className = 'day-swatch' + (d===selectedDay ? ' selected':'');
    sw.style.background = dayColor(d); sw.textContent = d;
    sw.addEventListener('click', ()=>{ selectedDay = d; buildDayPicker(); });
    dayColorPicker.appendChild(sw);
  }
}
function openPinModal(){
  document.getElementById('pinName').value = '';
  document.getElementById('pinNotes').value = '';
  selectedDay = (pins.length ? (pins[pins.length-1].day||1) : 1);
  buildDayPicker();
  pinModalOverlay.classList.add('open');
  setTimeout(()=>document.getElementById('pinName').focus(), 50);
}
document.getElementById('pinCancel').addEventListener('click', ()=>{ pinModalOverlay.classList.remove('open'); setMode(null); });
document.getElementById('pinSave').addEventListener('click', ()=>{
  const name = document.getElementById('pinName').value.trim();
  if(!name){ document.getElementById('pinName').focus(); return; }
  const notes = document.getElementById('pinNotes').value.trim();
  pins.push({ id:'p'+Date.now()+Math.random().toString(36).slice(2,6), name, notes, day:selectedDay, lat:editingPinCoords.lat, lng:editingPinCoords.lng });
  pinModalOverlay.classList.remove('open');
  saveData(); renderAll(); setMode(null);
});
function deletePin(id){
  pins = pins.filter(p=>p.id!==id);
  routes = routes.filter(r=> r.fromId!==id && r.toId!==id);
  saveData(); renderAll();
}

// ---------------- Route modal (offline lookup) ----------------
const routeModalOverlay = document.getElementById('routeModalOverlay');
const legsContainer = document.getElementById('legsContainer');
const routeSaveBtn = document.getElementById('routeSave');
let currentLegs = [];
let routeFromId = null, routeToId = null;

function openRouteModal(fromId, toId){
  routeFromId = fromId; routeToId = toId;
  const fromP = pins.find(p=>p.id===fromId), toP = pins.find(p=>p.id===toId);
  document.getElementById('routeFromTo').textContent = `${fromP.name} → ${toP.name}`;
  // Pre-fill with the pin names only if they actually match a known station; otherwise leave blank
  // so the person types the real station name themselves.
  const fromGuess = STATION_INDEX[fromP.name.toLowerCase()] ? fromP.name : '';
  const toGuess = STATION_INDEX[toP.name.toLowerCase()] ? toP.name : '';
  currentLegs = [{ from: fromGuess, to: toGuess, line:null, color:null, coords:null, approx:false, status:'idle' }];
  routeSaveBtn.disabled = true;
  renderLegs();
  routeModalOverlay.classList.add('open');
}
document.getElementById('routeCancel').addEventListener('click', ()=>{ routeModalOverlay.classList.remove('open'); });
document.getElementById('addLegBtn').addEventListener('click', ()=>{
  const last = currentLegs[currentLegs.length-1];
  currentLegs.push({ from: last ? last.to : '', to:'', line:null, color:null, coords:null, approx:false, status:'idle' });
  renderLegs();
  updateSaveEnabled();
});

function updateSaveEnabled(){
  routeSaveBtn.disabled = !currentLegs.every(l => l.status==='found' || l.status==='notfound');
}

function renderLegs(){
  legsContainer.innerHTML = currentLegs.map((leg,i)=>{
    let resultHtml = '';
    if(leg.status==='found'){
      resultHtml = `<div class="leg-result found">
        <div class="leg-result-bar" style="background:${leg.color};"></div>
        <div class="leg-result-body">
          <div class="leg-result-name">${escapeHtml(leg.line)}</div>
          <div class="leg-result-sub">${leg.stopCount} stop(s) along the line${leg.matches && leg.matches.length>1 ? ` · <a href="#" class="pick-other" data-i="${i}" style="color:var(--accent);">${leg.matches.length-1} other line(s) also connect these</a>` : ''}</div>
        </div>
      </div>`;
    } else if(leg.status==='notfound'){
      resultHtml = `<div class="leg-result notfound">${escapeHtml(leg.reason || "No direct line found between these two stops in the bundled dataset.")}</div>`;
    }
    return `
    <div class="leg-block" data-i="${i}">
      <div class="leg-top">
        <span>Leg ${i+1}</span>
        ${currentLegs.length>1 ? `<button class="leg-remove" data-remove="${i}">Remove</button>` : ''}
      </div>
      <div class="field autocomplete-box">
        <label>From station</label>
        <input type="text" autocomplete="off" data-field="from" data-i="${i}" value="${escapeAttr(leg.from)}">
        <div class="ac-list" data-ac="from-${i}"></div>
      </div>
      <div class="field autocomplete-box" style="margin-bottom:8px;">
        <label>To station</label>
        <input type="text" autocomplete="off" data-field="to" data-i="${i}" value="${escapeAttr(leg.to)}">
        <div class="ac-list" data-ac="to-${i}"></div>
      </div>
      <button class="find-btn" data-find="${i}">Find train line</button>
      ${resultHtml}
    </div>
  `;
  }).join('');

  legsContainer.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.i,10);
      const field = inp.dataset.field;
      currentLegs[i][field] = inp.value;
      currentLegs[i].status = 'idle'; currentLegs[i].line = null; currentLegs[i].coords = null;
      updateSaveEnabled();
      const acList = legsContainer.querySelector(`.ac-list[data-ac="${field}-${i}"]`);
      const results = searchStations(inp.value);
      if(results.length && inp.value.trim()){
        acList.innerHTML = results.map(name => {
          const display = LINE_DATA[Object.keys(LINE_DATA).find(l=>LINE_DATA[l].some(s=>s.name.toLowerCase()===name))]
            .find(s=>s.name.toLowerCase()===name).name;
          return `<div class="ac-item" data-name="${escapeAttr(display)}">${escapeHtml(display)}</div>`;
        }).join('');
        acList.classList.add('open');
        acList.querySelectorAll('.ac-item').forEach(item=>{
          item.addEventListener('mousedown', (e)=>{
            e.preventDefault();
            inp.value = item.dataset.name;
            currentLegs[i][field] = item.dataset.name;
            acList.classList.remove('open');
          });
        });
      } else {
        acList.classList.remove('open');
      }
    });
    inp.addEventListener('blur', ()=>{
      setTimeout(()=>{
        const i = inp.dataset.i, field = inp.dataset.field;
        const acList = legsContainer.querySelector(`.ac-list[data-ac="${field}-${i}"]`);
        if(acList) acList.classList.remove('open');
      }, 150);
    });
  });
  legsContainer.querySelectorAll('[data-find]').forEach(btn=>{
    btn.addEventListener('click', ()=> findLine(parseInt(btn.dataset.find,10)));
  });
  legsContainer.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentLegs.splice(parseInt(btn.dataset.remove,10),1);
      renderLegs(); updateSaveEnabled();
    });
  });
  legsContainer.querySelectorAll('.pick-other').forEach(a=>{
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      const i = parseInt(a.dataset.i,10);
      showMatchChoices(i);
    });
  });
}

function showMatchChoices(i){
  const leg = currentLegs[i];
  const block = legsContainer.querySelector(`.leg-block[data-i="${i}"]`);
  const choicesHtml = leg.matches.map((m,mi)=>`
    <div class="match-choice" data-mi="${mi}">
      <span class="legend-swatch" style="background:${m.color};width:16px;height:5px;border-radius:3px;"></span>${escapeHtml(m.line)}
    </div>`).join('');
  const wrap = document.createElement('div');
  wrap.innerHTML = choicesHtml;
  const existing = block.querySelector('.leg-result');
  existing.insertAdjacentElement('afterend', wrap);
  wrap.querySelectorAll('.match-choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = leg.matches[parseInt(el.dataset.mi,10)];
      leg.line = m.line; leg.color = m.color; leg.coords = m.coords; leg.stopCount = m.coords.length; leg.approx = false; leg.status='found';
      renderLegs(); updateSaveEnabled();
    });
  });
}

// Core offline matching: find which bundled line(s) contain BOTH station names, in order.
function findLine(i){
  const leg = currentLegs[i];
  const fromKey = leg.from.trim().toLowerCase();
  const toKey = leg.to.trim().toLowerCase();
  if(!fromKey || !toKey) return;

  const fromHits = STATION_INDEX[fromKey];
  const toHits = STATION_INDEX[toKey];

  if(!fromHits){ leg.status='notfound'; leg.reason = `"${leg.from}" isn't in the bundled station list — try the English station name (e.g. "Shibuya", "Ueno").`; renderLegs(); updateSaveEnabled(); return; }
  if(!toHits){ leg.status='notfound'; leg.reason = `"${leg.to}" isn't in the bundled station list — try the English station name.`; renderLegs(); updateSaveEnabled(); return; }

  const matches = [];
  fromHits.forEach(fh=>{
    const th = toHits.find(t=>t.line===fh.line);
    if(th && th.idx !== fh.idx){
      const stations = LINE_DATA[fh.line];
      const lo = Math.min(fh.idx, th.idx), hi = Math.max(fh.idx, th.idx);
      const slice = stations.slice(lo, hi+1).map(s=>[s.lat, s.lon]);
      const oriented = fh.idx <= th.idx ? slice : slice.slice().reverse();
      matches.push({ line: fh.line, color: colorForLine(fh.line), coords: oriented });
    }
  });

  if(matches.length===0){
    leg.status = 'notfound';
    leg.reason = `Found both stations, but no single bundled line stops at both "${leg.from}" and "${leg.to}" — they likely need a transfer. Try adding another leg for the connecting segment.`;
  } else {
    matches.sort((a,b)=> a.coords.length - b.coords.length);
    leg.line = matches[0].line; leg.color = matches[0].color; leg.coords = matches[0].coords;
    leg.stopCount = matches[0].coords.length; leg.matches = matches; leg.approx = false; leg.status = 'found';
  }
  renderLegs();
  updateSaveEnabled();
}

routeSaveBtn.addEventListener('click', ()=>{
  const fromP = pins.find(p=>p.id===routeFromId), toP = pins.find(p=>p.id===routeToId);
  const resolvedLegs = currentLegs.map((leg,i)=>{
    if(leg.status==='found'){
      return { line: leg.line, color: leg.color, from: leg.from, to: leg.to, coords: leg.coords, approx:false };
    }
    const startPt = i===0 ? [fromP.lat,fromP.lng] : (currentLegs[i-1].coords && currentLegs[i-1].coords.length>1 ? currentLegs[i-1].coords[currentLegs[i-1].coords.length-1] : [fromP.lat,fromP.lng]);
    const endPt = (i===currentLegs.length-1) ? [toP.lat,toP.lng] : startPt;
    return { line: (leg.from||'?') + ' → ' + (leg.to||'?') + ' (unmatched)', color:'#999999', from: leg.from, to: leg.to, coords:[startPt,endPt], approx:true };
  });
  routes.push({ id:'r'+Date.now()+Math.random().toString(36).slice(2,6), fromId:routeFromId, toId:routeToId, legs:resolvedLegs });
  routeModalOverlay.classList.remove('open');
  saveData(); renderAll();
});

// ---------------- Init ----------------
loadData();

})();
</script>
